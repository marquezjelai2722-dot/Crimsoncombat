name: Extract CrimsonCombat

on:
  workflow_dispatch:
  push:
    paths:
      - "CrimsonCombat_Repository.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract CrimsonCombat ZIP
        run: |
          rm -rf CrimsonCombat
          unzip -o CrimsonCombat_Repository.zip

      - name: Show extracted files
        run: |
          echo "CrimsonCombat files:"
          find CrimsonCombat -type f -print

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CrimsonCombat

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract CrimsonCombat repository"
            git push
          fi
